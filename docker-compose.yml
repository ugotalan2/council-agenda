version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5162:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=council_agenda_dev;Username=postgres;Password=postgres
      - Clerk__Domain=${CLERK_DOMAIN}
      - Clerk__SecretKey=${CLERK_SECRET_KEY}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - App__FrontendUrl=http://localhost:5173
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: council_agenda_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: